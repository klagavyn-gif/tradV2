name: Council QuantumLab Weekly

on:
  schedule:
    # Every Sunday at 23:30 UTC (Monday 06:30 AM Thai Time UTC+7)
    - cron: '30 23 * * 0'
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated symbols to test in sandbox'
        required: false
        default: 'BTCUSDT,ETHUSDT,SOLUSDT,SUIUSDT,PAXGUSDT'
      no_gemini:
        description: 'Force algorithmic evolutionary mutator without calling Gemini'
        type: boolean
        default: false
      notify_telegram:
        description: 'Broadcast Quantum Lab debrief to Telegram'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: council-quantum-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evolve_quantum_lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_PROGRESS_BAR: "off"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install numpy pandas requests yfinance
          fi

      - name: Run Council QuantumLab Evolutionary Cycle
        run: |
          ARGS="--data-dir .data/quantum_lab"
          if [ "${{ github.event.inputs.notify_telegram || 'true' }}" = "true" ]; then
            ARGS="$ARGS --notify-telegram"
          fi
          if [ "${{ github.event.inputs.no_gemini || 'false' }}" = "true" ]; then
            ARGS="$ARGS --no-gemini"
          fi
          if [ -n "${{ github.event.inputs.symbols }}" ]; then
            ARGS="$ARGS --symbols ${{ github.event.inputs.symbols }}"
          fi
          python tools/run_quantum_lab.py --run-cycle $ARGS

      - name: Upload Quantum Lab Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: council-quantum-lab-data
          path: .data/quantum_lab/**
          if-no-files-found: ignore
          retention-days: 60
